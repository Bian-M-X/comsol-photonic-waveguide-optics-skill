name: Agent compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-compat-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    name: Skill metadata and discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install metadata validation tooling
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.3,<7"

      - name: Validate skill and UI metadata schemas
        run: python -B scripts/test_skill_metadata.py

      - name: Verify cross-agent skill compatibility
        run: python -B scripts/test_agent_compatibility.py
